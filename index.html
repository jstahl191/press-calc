<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Press Calc">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>MWM Press & Profit Calc</title>
<style>
:root{--red:#c8102e;--bg:#f4f4f5;--card:#fff;--ink:#111;--mut:#666}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#111;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
header b{font-size:17px}header span{color:var(--red);font-weight:700}
button{border:0;border-radius:8px;padding:8px 12px;font-size:14px;background:#333;color:#fff}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--red);margin:2px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;color:var(--mut);display:block}
input,select{width:100%;font-size:17px;padding:9px;border:1px solid #ddd;border-radius:8px;margin-top:3px;background:#fafafa}
.out{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:15px}
.out div:nth-child(odd){color:var(--mut)}.out div:nth-child(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.big .card{margin:0;text-align:center}.big .v{font-size:22px;font-weight:700}.big .l{font-size:12px;color:var(--mut)}
.pos{color:#0a7a2f}.neg{color:var(--red)}
.bar{height:10px;background:#eee;border-radius:5px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--red)}
small{color:var(--mut)}
</style></head><body>
<header><b>Midwest Molding <span>Press Calc</span></b><button onclick="resetAll()">Reset</button></header>
<main>
<div class="big">
 <div class="card"><div class="l">Profit / Year</div><div class="v" id="b_py">–</div></div>
 <div class="card"><div class="l">Profit / Month</div><div class="v" id="b_pm">–</div></div>
 <div class="card"><div class="l">Run Hrs / Month</div><div class="v" id="b_hm">–</div></div>
 <div class="card"><div class="l">Piece Price</div><div class="v" id="b_mg">–</div></div>
</div>

<div class="card"><h2>Part & Volume</h2><div class="grid">
 <div><label>Annual volume (pcs)</label><input id="vol" type="number" inputmode="decimal" value=""></div>
 <div><label>Cavities</label><input id="cav" type="number" inputmode="decimal" value=""></div>
 <div><label>Cycle time (sec)</label><input id="cycle" type="number" inputmode="decimal" step="0.1" value=""></div>
 <div><label>Efficiency / OEE (%)</label><input id="eff" type="number" inputmode="decimal" value="100"></div>
 <div><label>Scrap (%)</label><input id="scrap" type="number" inputmode="decimal" value=""></div>
</div></div>

<div class="card"><h2>Press & Costs</h2><div class="grid">
 <div><label>Press rate ($/hr)</label><input id="rate" type="number" inputmode="decimal" value=""></div>
 <div><label>Labor ($/hr)</label><input id="labor" type="number" inputmode="decimal" value=""></div>
 <div><label>Part weight (lbs)</label><input id="wt" type="number" inputmode="decimal" step="0.001" value=""></div>
 <div><label>Material ($/lb)</label><input id="mat" type="number" inputmode="decimal" step="0.01" value=""></div>
</div></div>

<div class="card"><h2>Press Availability</h2><div class="grid">
 <div><label>Hours / day</label><input id="hpd" type="number" inputmode="decimal" value="24"></div>
 <div><label>Days / week</label><input id="dpw" type="number" inputmode="decimal" value="7"></div>
</div>
<div style="margin-top:10px"><small>Press capacity used: <b id="util">–</b></small><div class="bar"><i id="ubar" style="width:0"></i></div></div>
</div>

<div class="card"><h2>Run Hours</h2><div class="out" id="o_hours"></div></div>
<div class="card"><h2>Cost per Part</h2><div class="out" id="o_cost"></div></div>
<div class="card"><h2>Money</h2><div class="out" id="o_money"></div></div>
<p style="text-align:center"><small>Saved automatically on this device.</small></p>
</main>
<script>
const ids=["vol","cav","cycle","eff","scrap","rate","labor","wt","mat","hpd","dpw"];
const defs={eff:"100",hpd:"24",dpw:"7"};
const $=i=>parseFloat(document.getElementById(i).value)||0;
const usd=(n,d=2)=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const num=(n,d=0)=>n.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
function rows(el,arr){document.getElementById(el).innerHTML=arr.map(([a,b])=>`<div>${a}</div><div>${b}</div>`).join("")}
function calc(){
 const vol=$("vol"),cav=$("cav")||1,cyc=$("cycle"),eff=$("eff")/100||1,scrap=$("scrap")/100;
 const shotsPerHr=cyc>0?3600/cyc:0;
 const partsPerHr=shotsPerHr*cav;
 const volMo=vol/12;
 const hrsMo=partsPerHr>0?volMo/partsPerHr:0, hrsYr=hrsMo*12;
 const rate=$("rate"),labor=$("labor");
 const matPc=$("wt")*$("mat")*(1+scrap);
 const pressPc=partsPerHr>0?rate/partsPerHr:0;
 const laborPc=partsPerHr>0?labor/partsPerHr:0;
 const pricePc=matPc+pressPc+laborPc;
 const profMo=hrsMo*rate, profYr=profMo*12;
 const availMo=$("hpd")*$("dpw")*52/12*eff;
 const util=availMo>0?hrsMo/availMo:0;
 const set=(id,t,c)=>{const e=document.getElementById(id);e.textContent=t;e.className="v "+(c||"")};
 set("b_py",usd(profYr),"pos");set("b_pm",usd(profMo),"pos");set("b_hm",num(hrsMo,1));set("b_mg",usd(pricePc,4));
 document.getElementById("util").textContent=num(hrsMo,1)+" of "+num(availMo,1)+" available hrs/month at "+num(eff*100,0)+"% OEE ("+num(util*100,1)+"%)";
 document.getElementById("ubar").style.width=Math.min(util*100,100)+"%";
 rows("o_hours",[["Parts / hr",num(partsPerHr,1)],["Shots / hr",num(shotsPerHr,1)],["Run hrs / yr",num(hrsYr,1)],["Run hrs / month",num(hrsMo,1)],["Volume / month",num(volMo)]]);
 rows("o_cost",[["Material (w/ scrap)",usd(matPc,4)],["Press",usd(pressPc,4)],["Labor",usd(laborPc,4)],["Piece price",usd(pricePc,4)],["Price / 1,000",usd(pricePc*1000,2)]]);
 rows("o_money",[["Profit / month (rate × hrs)",usd(profMo)],["Profit / yr",usd(profYr)],["Material lbs / month",num(volMo*$("wt"))],["Material lbs / yr",num(vol*$("wt"))]]);
 const s={};ids.forEach(i=>s[i]=document.getElementById(i).value);localStorage.setItem("mwmcalc3",JSON.stringify(s));
}
function resetAll(){ids.forEach(i=>document.getElementById(i).value=defs[i]||"");calc()}
try{const s=JSON.parse(localStorage.getItem("mwmcalc3")||"{}");ids.forEach(i=>{if(s[i]!==undefined)document.getElementById(i).value=s[i]})}catch(e){}
ids.forEach(i=>document.getElementById(i).addEventListener("input",calc));calc();
</script></body></html>
