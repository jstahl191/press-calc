<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Press Calc">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>MWM Press & Profit Calc</title>
<style>
:root{--red:#c8102e;--bg:#f4f4f5;--card:#fff;--ink:#111;--mut:#666}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#111;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
header b{font-size:17px}header span{color:var(--red);font-weight:700}
button{border:0;border-radius:8px;padding:8px 12px;font-size:14px;background:#333;color:#fff}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--red);margin:2px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;color:var(--mut);display:block}
input,select{width:100%;font-size:17px;padding:9px;border:1px solid #ddd;border-radius:8px;margin-top:3px;background:#fafafa}
.out{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:15px}
.out div:nth-child(odd){color:var(--mut)}.out div:nth-child(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.big .card{margin:0;text-align:center}.big .v{font-size:22px;font-weight:700}.big .l{font-size:12px;color:var(--mut)}
.pos{color:#0a7a2f}.neg{color:var(--red)}
.bar{height:10px;background:#eee;border-radius:5px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--red)}
small{color:var(--mut)}
</style></head><body>
<header><b>Midwest Molding <span>Press Calc</span></b><button onclick="resetAll()">Reset</button></header>
<main>
<div class="big">
 <div class="card"><div class="l">Profit / Year</div><div class="v" id="b_py">–</div></div>
 <div class="card"><div class="l">Profit / Month</div><div class="v" id="b_pm">–</div></div>
 <div class="card"><div class="l">Run Hrs / Month</div><div class="v" id="b_hm">–</div></div>
 <div class="card"><div class="l">Margin</div><div class="v" id="b_mg">–</div></div>
</div>

<div class="card"><h2>Part & Volume</h2><div class="grid">
 <div><label>Annual volume (pcs)</label><input id="vol" type="number" inputmode="decimal" value="100000"></div>
 <div><label>Piece price ($)</label><input id="price" type="number" inputmode="decimal" step="0.0001" value="1.60"></div>
 <div><label>Cavities</label><input id="cav" type="number" inputmode="decimal" value="1"></div>
 <div><label>Cycle time (sec)</label><input id="cycle" type="number" inputmode="decimal" step="0.1" value="45"></div>
 <div><label>Efficiency / OEE (%)</label><input id="eff" type="number" inputmode="decimal" value="85"></div>
 <div><label>Scrap (%)</label><input id="scrap" type="number" inputmode="decimal" value="3"></div>
</div></div>

<div class="card"><h2>Press & Costs</h2><div class="grid">
 <div><label>Press rate ($/hr)</label><input id="rate" type="number" inputmode="decimal" value="75"></div>
 <div><label>Extra labor ($/hr)</label><input id="labor" type="number" inputmode="decimal" value="0"></div>
 <div><label>Part weight (lbs)</label><input id="wt" type="number" inputmode="decimal" step="0.001" value="0.10"></div>
 <div><label>Material ($/lb)</label><input id="mat" type="number" inputmode="decimal" step="0.01" value="1.50"></div>
 <div><label>Packaging ($/pc)</label><input id="pack" type="number" inputmode="decimal" step="0.001" value="0.02"></div>
 <div><label>Other ($/pc)</label><input id="other" type="number" inputmode="decimal" step="0.001" value="0"></div>
 <div><label>Setup hrs / run</label><input id="setup" type="number" inputmode="decimal" value="0"></div>
 <div><label>Runs / year</label><input id="runs" type="number" inputmode="decimal" value="12"></div>
</div></div>

<div class="card"><h2>Press Availability</h2><div class="grid">
 <div><label>Hours / day</label><input id="hpd" type="number" inputmode="decimal" value="24"></div>
 <div><label>Days / week</label><input id="dpw" type="number" inputmode="decimal" value="5"></div>
</div>
<div style="margin-top:10px"><small>Press capacity used: <b id="util">–</b></small><div class="bar"><i id="ubar" style="width:0"></i></div></div>
</div>

<div class="card"><h2>Run Hours</h2><div class="out" id="o_hours"></div></div>
<div class="card"><h2>Cost per Part</h2><div class="out" id="o_cost"></div></div>
<div class="card"><h2>Money</h2><div class="out" id="o_money"></div></div>
<p style="text-align:center"><small>Saved automatically on this device.</small></p>
</main>
<script>
const ids=["vol","price","cav","cycle","eff","scrap","rate","labor","wt","mat","pack","other","setup","runs","hpd","dpw"];
const defs={};ids.forEach(i=>defs[i]=document.getElementById(i).value);
const $=i=>parseFloat(document.getElementById(i).value)||0;
const usd=(n,d=0)=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const num=(n,d=0)=>n.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
function rows(el,arr){document.getElementById(el).innerHTML=arr.map(([a,b])=>`<div>${a}</div><div>${b}</div>`).join("")}
function calc(){
 const vol=$("vol"),cav=$("cav")||1,cyc=$("cycle"),eff=$("eff")/100||1,scrap=$("scrap")/100;
 const goodPerHr=cyc>0?(3600/cyc)*cav*eff*(1-scrap):0;
 const runHrsYr=goodPerHr>0?vol/goodPerHr:0;
 const setupHrsYr=$("setup")*$("runs");
 const totHrsYr=runHrsYr+setupHrsYr;
 const hrRate=$("rate")+$("labor");
 const shotsNeeded=vol/(1-scrap||1)/cav;
 const matPc=$("wt")*$("mat")/(1-scrap||1);
 const pressPc=vol>0?totHrsYr*hrRate/vol:0;
 const costPc=matPc+pressPc+$("pack")+$("other");
 const price=$("price"),profPc=price-costPc;
 const revYr=vol*price,costYr=vol*costPc,profYr=revYr-costYr;
 const availYr=$("hpd")*$("dpw")*52;
 const util=availYr>0?totHrsYr/availYr:0;
 const margin=revYr>0?profYr/revYr:0;
 const cls=n=>n>=0?"pos":"neg";
 const set=(id,t,c)=>{const e=document.getElementById(id);e.textContent=t;e.className="v "+(c||"")};
 set("b_py",usd(profYr),cls(profYr));set("b_pm",usd(profYr/12),cls(profYr));
 set("b_hm",num(totHrsYr/12,1));set("b_mg",num(margin*100,1)+"%",cls(margin));
 document.getElementById("util").textContent=num(util*100,1)+"% of "+num(availYr)+" hrs/yr";
 document.getElementById("ubar").style.width=Math.min(util*100,100)+"%";
 rows("o_hours",[["Good parts / hr",num(goodPerHr,1)],["Shots needed / yr",num(shotsNeeded)],["Run hrs / yr",num(runHrsYr,1)],["Setup hrs / yr",num(setupHrsYr,1)],["Total hrs / yr",num(totHrsYr,1)],["Total hrs / month",num(totHrsYr/12,1)],["Total hrs / week",num(totHrsYr/52,1)],["Shifts / month (8 hr)",num(totHrsYr/12/8,1)],["Volume / month",num(vol/12)]]);
 rows("o_cost",[["Material",usd(matPc,4)],["Press + labor",usd(pressPc,4)],["Packaging",usd($("pack"),4)],["Other",usd($("other"),4)],["Total cost / pc",usd(costPc,4)],["Profit / pc",`<span class="${cls(profPc)}">${usd(profPc,4)}</span>`]]);
 rows("o_money",[["Revenue / yr",usd(revYr)],["Revenue / month",usd(revYr/12)],["Cost / yr",usd(costYr)],["Profit / yr",`<span class="${cls(profYr)}">${usd(profYr)}</span>`],["Profit / month",`<span class="${cls(profYr)}">${usd(profYr/12)}</span>`],["Profit / press hr",usd(totHrsYr>0?profYr/totHrsYr:0,2)],["Revenue / press hr",usd(totHrsYr>0?revYr/totHrsYr:0,2)],["Material lbs / yr",num(vol*$("wt")/(1-scrap||1))]]);
 const s={};ids.forEach(i=>s[i]=document.getElementById(i).value);localStorage.setItem("mwmcalc",JSON.stringify(s));
}
function resetAll(){ids.forEach(i=>document.getElementById(i).value=defs[i]);calc()}
try{const s=JSON.parse(localStorage.getItem("mwmcalc")||"{}");ids.forEach(i=>{if(s[i]!==undefined)document.getElementById(i).value=s[i]})}catch(e){}
ids.forEach(i=>document.getElementById(i).addEventListener("input",calc));calc();
</script></body></html>
